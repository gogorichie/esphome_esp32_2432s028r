esphome:
  name: esphome05
  friendly_name: cyb01

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Esphome05 Fallback Hotspot"
    password: !secret wifi_password

# Time component for display
time:
  - platform: homeassistant
    id: ha_time

# Display configuration
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

font:
  - file: "Roboto-Bold.ttf"
    id: font_xl
    size: 48
    glyphs: "0123456789:"
  - file: "Roboto-Bold.ttf"
    id: font_large
    size: 36
  - file: "Roboto-Regular.ttf"
    id: font_small
    size: 16
  - file: "Roboto-Regular.ttf"
    id: font_tiny
    size: 12


# Import sensors from Home Assistant
sensor:
  # Weather/Temperature
  - platform: homeassistant
    id: outdoor_temp
    entity_id: sensor.openweathermap_feels_like_temperature

  # Office temperature
  - platform: homeassistant
    id: office_temp
    entity_id: sensor.smartthings_button_temperature

  # Show these within HASS
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    filters:
      - lambda: return x / 3600;
    unit_of_measurement: "h"
    accuracy_decimals: 1


# Import text sensors
text_sensor:
  # Weather condition
  - platform: homeassistant
    id: weather_condition
    entity_id: sensor.openweathermap_condition

  # Next calendar event
  - platform: homeassistant
    id: next_meeting
    entity_id: calendar.ical_richard_s_calendar
    attribute: message


# Binary sensors for door status
binary_sensor:
  - platform: homeassistant
    id: front_door
    entity_id: binary_sensor.front_entrance_contact

  - platform: homeassistant
    id: garage_door
    entity_id: binary_sensor.garage_entrance_contact

  - platform: homeassistant
    id: patio_door
    entity_id: binary_sensor.patio_entrance_contact

display:
  - platform: ili9xxx
    model: TFT_2.4
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO33
    color_palette: 8BIT
    invert_colors: false
    rotation: 90
    update_interval: 5s
    lambda: |-
      // 320x240 layout: clock header / temp cards / next meeting / door pills
      const Color CARD(32, 36, 64);
      const Color MUTED(150, 150, 170);
      const Color ACCENT(255, 200, 0);
      const Color OPEN_C(200, 0, 0);
      const Color SHUT_C(0, 110, 40);
      const Color UNK_C(80, 80, 80);
      it.fill(COLOR_OFF);

      // Header: big clock (no leading zero) + AM/PM, date and weather on the right
      auto now = id(ha_time).now();
      if (now.is_valid()) {
        std::string t = now.strftime("%I:%M");
        if (t[0] == '0') t.erase(0, 1);
        int x1, y1, w, h;
        it.get_text_bounds(10, 2, t.c_str(), id(font_xl), TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
        it.print(10, 2, id(font_xl), t.c_str());
        it.print(10 + w + 4, 10, id(font_small), ACCENT, now.strftime("%p").c_str());
        it.print(310, 8, id(font_small), MUTED, TextAlign::TOP_RIGHT, now.strftime("%a %b %d").c_str());
      }
      if (id(weather_condition).has_state()) {
        // HA conditions look like "partlycloudy" / "clear-night" / "lightning-rainy"
        std::string c = id(weather_condition).state;
        if (c == "partlycloudy") c = "Partly cloudy";
        else if (c == "clear-night") c = "Clear";
        else {
          for (auto &ch : c) if (ch == '-') ch = ' ';
          if (!c.empty()) c[0] = toupper(c[0]);
        }
        it.print(310, 32, id(font_small), TextAlign::TOP_RIGHT, c.c_str());
      }
      it.line(8, 62, 312, 62, ACCENT);

      // Temperature cards
      auto card = [&](int x, const char *label, sensor::Sensor *s) {
        it.filled_rectangle(x, 70, 148, 68, CARD);
        it.print(x + 8, 76, id(font_tiny), MUTED, label);
        if (s->has_state() && !std::isnan(s->state))
          it.printf(x + 74, 92, id(font_large), TextAlign::TOP_CENTER, "%.1f°", s->state);
        else
          it.print(x + 74, 92, id(font_large), MUTED, TextAlign::TOP_CENTER, "--");
      };
      card(8, "INSIDE", id(office_temp));
      card(164, "OUTSIDE", id(outdoor_temp));

      // Next meeting
      it.filled_rectangle(8, 146, 304, 44, CARD);
      it.print(16, 150, id(font_tiny), ACCENT, "NEXT UP");
      std::string m = id(next_meeting).has_state() ? id(next_meeting).state : "";
      if (m.empty() || m == "unavailable" || m == "unknown") m = "No meetings";
      else if (m.length() > 34) m = m.substr(0, 31) + "...";
      it.print(16, 166, id(font_small), m.c_str());

      // Door pills: green closed, red open, grey unknown
      auto door = [&](int x, const char *name, binary_sensor::BinarySensor *d) {
        bool known = d->has_state();
        bool open = known && d->state;
        it.filled_rectangle(x, 198, 96, 36, !known ? UNK_C : (open ? OPEN_C : SHUT_C));
        it.print(x + 48, 201, id(font_tiny), TextAlign::TOP_CENTER, name);
        it.print(x + 48, 215, id(font_small), TextAlign::TOP_CENTER, !known ? "?" : (open ? "OPEN" : "Closed"));
      };
      door(8, "FRONT", id(front_door));
      door(112, "GARAGE", id(garage_door));
      door(216, "PATIO", id(patio_door));

# Touchscreen
touchscreen:
  - platform: xpt2046
    id: my_touchscreen
    cs_pin: GPIO25
    interrupt_pin: GPIO36
    update_interval: 50ms
    calibration:
      x_min: 200
      x_max: 3900
      y_min: 200
      y_max: 3900
    on_touch:
      - light.toggle: back_light

output:
  # Backlight
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

  # Onboard RGB LED: three discrete pins, active-low
  - platform: ledc
    pin: GPIO4
    id: led_r
    inverted: true
  - platform: ledc
    pin: GPIO16
    id: led_g
    inverted: true
  - platform: ledc
    pin: GPIO17
    id: led_b
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON

  # RGB LED on the back of the board
  - platform: rgb
    id: rgb_led
    name: "RGB LED"
    red: led_r
    green: led_g
    blue: led_b
    restore_mode: ALWAYS_OFF

button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "Toggle RGB LED"
    on_press:
      - light.toggle: rgb_led
